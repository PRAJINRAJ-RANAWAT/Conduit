# `docker compose up -d --build` starts the whole stack.
x-app: &app            # settings shared by every Python service
  build: .
  environment:
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgresql://conduit:conduit@postgres:5432/conduit
    RABBIT_URL: amqp://guest:guest@rabbitmq:5672/%2F
    PROVIDER_A_URL: http://mock-a:9000
    PROVIDER_B_URL: http://mock-b:9000
    CORS_ORIGINS: http://localhost:3100
    DISPATCH_MODE: ${DISPATCH_MODE:-fair}       # fair = Deficit Round Robin, fifo = oldest first (experiment baseline)
    MAX_INFLIGHT: ${MAX_INFLIGHT:-50}           # most jobs allowed out in RabbitMQ/workers at once
    PROVIDER_SLOTS: ${PROVIDER_SLOTS:-400}      # shared concurrent provider calls (interactive first, batch gets the residual)
  depends_on:
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    postgres: {condition: service_healthy}

services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20}
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 5s, retries: 30}
  postgres:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: conduit, POSTGRES_USER: conduit, POSTGRES_DB: conduit}
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "conduit"], interval: 3s, retries: 20}
  mock-a:                      # fake LLM provider A (port 9000 on your machine)
    build: .
    command: uvicorn app.mock_provider:app --host 0.0.0.0 --port 9000
    environment: {MOCK_LATENCY: "${MOCK_LATENCY:-0.2}"}
    ports: ["9000:9000"]
  mock-b:                      # fake LLM provider B
    build: .
    command: uvicorn app.mock_provider:app --host 0.0.0.0 --port 9000
    environment: {MOCK_LATENCY: "${MOCK_LATENCY:-0.2}"}
    ports: ["9001:9000"]
  gateway-1:                   # two identical gateway replicas...
    <<: *app
  gateway-2:
    <<: *app
  nginx:                       # ...behind a load balancer. This is "the gateway" on http://localhost:8080
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [gateway-1, gateway-2]
  worker:
    <<: *app
    command: python -m app.worker
    deploy:
      replicas: ${WORKERS:-3}              # 3 worker replicas (WORKERS=1 for the single-worker benchmark)
  dispatcher:                  # 2 replicas, only the leader (Postgres advisory lock) is active
    <<: *app
    command: python -m app.dispatcher
    deploy:
      replicas: 2
  web:                         # the Next.js UI on http://localhost:3100
    build: ./web
    ports: ["3100:3000"]
    volumes: ["./bench/results:/data/bench:ro"]   # the landing page reads real benchmark numbers from here
    depends_on: [nginx]
