# Infrastructure only. Gateway/worker/UI are added to this file in later steps.
services:
  redis:
    image: redis:7
    ports: ["6379:6379"]
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
  postgres:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: conduit, POSTGRES_USER: conduit, POSTGRES_DB: conduit}
    ports: ["5432:5432"]
