# Load balancer in front of the two gateway replicas (round-robin).
events { worker_connections 4096; }
http {
  upstream gateways {
    server gateway-1:8080;
    server gateway-2:8080;
    keepalive 64;                       # reuse connections to the gateways
  }
  server {
    listen 80;
    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;              # do not hold back streamed responses
    }
  }
}
