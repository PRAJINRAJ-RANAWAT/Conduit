# Production stack for ONE small ARM64 VM (t4g.small, 2 GB RAM). Images come from GHCR (built by CI, tag = git SHA).
# Memory limits (mem_limit) keep one greedy container from taking the whole box; see docs/DEPLOYMENT.md for the budget.
# Only NGINX publishes ports (80/443). Secrets come from /opt/conduit/.env, which deploy.sh fills from SSM Parameter Store.
x-app: &app
  image: ghcr.io/${GHCR_OWNER}/conduit-app:${IMAGE_TAG}
  restart: unless-stopped
  environment: &appenv
    REDIS_URL: redis://redis:6379
    DATABASE_URL: postgresql://conduit:${POSTGRES_PASSWORD}@postgres:5432/conduit
    RABBIT_URL: amqp://conduit:${RABBIT_PASSWORD}@rabbitmq:5672/%2F
    PROVIDER_A_URL: http://mock-a:9000
    PROVIDER_B_URL: http://mock-b:9000
    CORS_ORIGINS: https://${DOMAIN}
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    DISPATCH_MODE: fair
    MAX_INFLIGHT: "50"
    PROVIDER_SLOTS: "200"
  depends_on:
    redis: {condition: service_healthy}
    rabbitmq: {condition: service_healthy}
    postgres: {condition: service_healthy}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    mem_limit: 256m
    environment: {POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_USER: conduit, POSTGRES_DB: conduit}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "conduit"], interval: 5s, retries: 20}
  redis:
    image: redis:7
    restart: unless-stopped
    mem_limit: 128m
    # AOF on: every write is appended to disk and fsynced once per second (at most ~1s of data lost on a crash).
    # volatile-lru: if memory ever fills, evict only keys that have a TTL (cache, limiter buckets), never the counters.
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 96mb --maxmemory-policy volatile-lru
    volumes: ["redisdata:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 20}
  rabbitmq:
    image: rabbitmq:3.13
    restart: unless-stopped
    mem_limit: 384m
    environment: {RABBITMQ_DEFAULT_USER: conduit, RABBITMQ_DEFAULT_PASS: "${RABBIT_PASSWORD}"}
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck: {test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, retries: 30}
  mock-a:
    <<: *app
    command: uvicorn app.mock_provider:app --host 0.0.0.0 --port 9000
    mem_limit: 64m
    depends_on: {}
  mock-b:
    <<: *app
    command: uvicorn app.mock_provider:app --host 0.0.0.0 --port 9000
    mem_limit: 64m
    depends_on: {}
  gateway-1:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    mem_limit: 160m
  gateway-2:
    <<: *app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    mem_limit: 160m
  worker:
    <<: *app
    command: python -m app.worker
    mem_limit: 100m
    deploy: {replicas: 2}
  dispatcher:
    <<: *app
    command: python -m app.dispatcher
    mem_limit: 64m
    deploy: {replicas: 2}
  web:
    image: ghcr.io/${GHCR_OWNER}/conduit-web:${IMAGE_TAG}
    restart: unless-stopped
    mem_limit: 96m
    environment: {BENCH_DIR: /data/bench}
    volumes: ["./bench:/data/bench:ro"]       # landing-page stats file, shipped by the deploy
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    mem_limit: 32m
    ports: ["80:80", "443:443"]
    environment: {DOMAIN: "${DOMAIN}"}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro   # nginx fills in ${DOMAIN}
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on: [gateway-1, gateway-2, web]
  certbot:                       # run on demand (init-tls.sh and the renewal timer), not a long-running service
    image: certbot/certbot
    profiles: ["tools"]
    volumes: ["letsencrypt:/etc/letsencrypt", "certbot-webroot:/var/www/certbot"]

volumes: {pgdata: {}, redisdata: {}, rabbitdata: {}, letsencrypt: {}, certbot-webroot: {}}
