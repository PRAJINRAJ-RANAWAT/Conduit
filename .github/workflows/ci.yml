# CI: lint, tests against REAL Redis/RabbitMQ/Postgres, secret scan, Docker build.
name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3      # runs `ruff check` using ruff.toml

  test:
    runs-on: ubuntu-latest
    services:                               # real services, not mocks (same ports the tests expect)
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3.13
        ports: ["5672:5672"]
        options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-retries 30
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: conduit, POSTGRES_PASSWORD: conduit, POSTGRES_DB: conduit}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U conduit" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: pytest -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}              # gitleaks scans the whole history
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t conduit-app .
      - run: docker build -t conduit-web ./web
